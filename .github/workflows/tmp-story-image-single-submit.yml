name: Temporary story image single-submit patch

on:
  push:
    paths:
      - '.github/workflows/tmp-story-image-single-submit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_story_image_single_submit.py
      - name: Verify diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/backgroundImageJobs.ts components/date/story/StoryTheaterSession.tsx
          git commit -m "fix: prevent duplicate story image submissions"
          git push origin master
