name: Apply emoji role availability patch

on:
  push:
    branches:
      - feat/emoji-role-availability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/emoji-role-availability
          fetch-depth: 0

      - name: Apply targeted source patch
        run: node scripts/apply-emoji-role-availability.mjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types.ts apps/Chat.tsx components/chat/ChatModals.tsx utils/chatPrompts.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: add role availability switch for emoji groups"
          git push origin HEAD:feat/emoji-role-availability
