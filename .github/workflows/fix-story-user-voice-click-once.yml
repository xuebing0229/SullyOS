name: Fix story user voice click

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-story-user-voice-click-once.yml'
      - '.github/scripts/fix-story-user-voice-click.py'

permissions:
  contents: write

jobs:
  fix-story-user-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply user dialogue voice patch
        run: python .github/scripts/fix-story-user-voice-click.py

      - name: Verify scope and patch shape
        run: |
          git diff --check
          grep -q "plainUserInput voiceSpeakers" components/date/story/StoryTheaterSession.tsx
          grep -q "sourceRole: message.role" components/date/story/StoryTheaterSession.tsx
          grep -q "sourceRole?: 'user' | 'assistant'" utils/storyTheaterVoiceClassifier.ts

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc --noEmit

      - name: Build web app
        run: pnpm run build

      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-story-user-voice-click-once.yml
          rm .github/scripts/fix-story-user-voice-click.py
          rm -f .github/story-user-voice-click-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx utils/storyTheaterVoiceClassifier.ts .github/workflows/fix-story-user-voice-click-once.yml .github/scripts/fix-story-user-voice-click.py .github/story-user-voice-click-trigger
          git diff --cached --check
          git commit -m "fix(story): enable user dialogue voice taps"
          git push origin HEAD:master
