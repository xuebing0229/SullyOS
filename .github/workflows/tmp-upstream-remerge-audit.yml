name: tmp-upstream-full-verification

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh merge verifier baseline
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-upstream-merge.mjs')
          s = p.read_text()
          s = s.replace("    'const DB_VERSION = 76',\n", '')
          s = s.replace("} else if (Number(match[1]) < 70) {", "} else if (Number(match[1]) < 78) {")
          s = s.replace("不得低于整合线 v70", "不得低于当前整合基线 v78")
          p.write_text(s)
          PY
          grep -q "Number(match\[1\]) < 78" scripts/verify-upstream-merge.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verifier tests and production build
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/upstream-verify

          pnpm run verify:upstream-merge > /tmp/upstream-verify/invariants.log 2>&1
          inv=$?

          {
            grep -Fq 'const OUTBOUND_ANALYTICS_DISABLED = true' utils/analytics.ts &&
            grep -Fq 'if (OUTBOUND_ANALYTICS_DISABLED) return;' utils/analytics.ts &&
            grep -Fq 'replaceStoryTheaterReply' components/date/story/StoryTheaterSession.tsx &&
            grep -Fq 'theaterRequestKey: activeRequestKey' components/date/story/StoryTheaterSession.tsx &&
            grep -Fq 'cancelStoryGenerationByOwner' components/date/story/StoryTheaterSession.tsx &&
            grep -Fq 'executeStoryCompletionInCloudBackground' components/date/story/StoryTheaterSession.tsx &&
            grep -Fq 'executeStoryCompletionInNativeBackground' components/date/story/StoryTheaterSession.tsx &&
            grep -Fq 'group?: string' types.ts &&
            grep -Fq 'section?:' types.ts
          } > /tmp/upstream-verify/guards.log 2>&1
          guards=$?

          pnpm test:run > /tmp/upstream-verify/tests.log 2>&1
          tests=$?

          pnpm run build > /tmp/upstream-verify/build.log 2>&1
          build=$?

          {
            echo "invariants=$inv"
            echo "custom_guards=$guards"
            echo "tests=$tests"
            echo "build=$build"
            echo
            echo '=== GIT STATUS AFTER BUILD ==='
            git status --short
            echo
            echo '=== INVARIANTS ==='
            tail -n 120 /tmp/upstream-verify/invariants.log
            echo
            echo '=== TESTS (tail) ==='
            tail -n 240 /tmp/upstream-verify/tests.log
            echo
            echo '=== BUILD (tail) ==='
            tail -n 240 /tmp/upstream-verify/build.log
          } > .github/tmp-upstream-full-verification.txt
          cat .github/tmp-upstream-full-verification.txt

          git config user.name "SullyOS Upstream Merge Bot"
          git config user.email "merge-bot@users.noreply.github.com"
          git add scripts/verify-upstream-merge.mjs .github/tmp-upstream-full-verification.txt
          if [ "$build" -eq 0 ]; then
            git add public/amsg-worker.bundle.js worker/amsg/worker.bundle.js 2>/dev/null || true
          fi
          git diff --cached --check
          git commit -m "chore: refresh upstream merge verification baseline and results" || true
          git push origin HEAD:merge/upstream-20260908

          if [ "$inv" -ne 0 ] || [ "$guards" -ne 0 ] || [ "$tests" -ne 0 ] || [ "$build" -ne 0 ]; then
            exit 1
          fi
