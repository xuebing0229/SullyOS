name: tmp-upstream-conflict-split

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split semantic conflict blocks by file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SullyOS Upstream Merge Audit"
          git config user.email "merge-audit@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git 2>/dev/null || git remote set-url upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master
          set +e
          git merge --no-commit --no-ff upstream/master
          set -e
          rm -rf /tmp/conflicts .github/tmp-upstream-conflicts
          mkdir -p /tmp/conflicts .github/tmp-upstream-conflicts
          python - <<'PY'
          from pathlib import Path
          import subprocess, re
          files = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          for idx, rel in enumerate(files, 1):
              lines = Path(rel).read_text(errors='replace').splitlines()
              out = [f'FILE: {rel}']
              i = 0; block = 0
              while i < len(lines):
                  if lines[i].startswith('<<<<<<< '):
                      block += 1; start=i; j=i+1
                      while j < len(lines) and not lines[j].startswith('>>>>>>> '): j += 1
                      end=min(j,len(lines)-1); lo=max(0,start-5); hi=min(len(lines),end+6)
                      out += ['', f'--- CONFLICT {block} ---']
                      out += lines[lo:hi]
                      i=end+1
                  else: i+=1
              safe = re.sub(r'[^A-Za-z0-9_.-]+','__',rel)
              Path(f'.github/tmp-upstream-conflicts/{idx:02d}-{safe}.txt').write_text('\n'.join(out)+'\n')
          PY
          git merge --abort >/dev/null 2>&1 || true
          git add .github/tmp-upstream-conflicts
          git commit -m "chore: split upstream conflict reports" || true
          git push origin HEAD:merge/upstream-20260908
