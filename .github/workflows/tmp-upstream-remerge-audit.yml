name: tmp-upstream-invariant-diagnostic

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture invariant diagnostics
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "SullyOS Upstream Merge Audit"
          git config user.email "merge-audit@users.noreply.github.com"
          {
            echo '=== verify-upstream-merge ==='
            node scripts/verify-upstream-merge.mjs || true
            echo '=== custom guards ==='
            for spec in \
              'analytics-disabled|utils/analytics.ts|const OUTBOUND_ANALYTICS_DISABLED = true' \
              'analytics-return|utils/analytics.ts|if (OUTBOUND_ANALYTICS_DISABLED) return;' \
              'story-replace|components/date/story/StoryTheaterSession.tsx|replaceStoryTheaterReply' \
              'story-request-key|components/date/story/StoryTheaterSession.tsx|theaterRequestKey: activeRequestKey' \
              'story-cancel|components/date/story/StoryTheaterSession.tsx|cancelStoryGenerationByOwner' \
              'story-cloud|components/date/story/StoryTheaterSession.tsx|executeStoryCompletionInCloudBackground' \
              'story-native|components/date/story/StoryTheaterSession.tsx|executeStoryCompletionInNativeBackground' \
              'preset-group|types.ts|group?: string' \
              'preset-section|types.ts|section?:'; do
              IFS='|' read -r name file pattern <<< "$spec"
              if grep -Fq "$pattern" "$file"; then echo "$name=ok"; else echo "$name=MISSING"; fi
            done
          } > .github/tmp-upstream-invariant-diagnostic.txt 2>&1
          cat .github/tmp-upstream-invariant-diagnostic.txt
          git add .github/tmp-upstream-invariant-diagnostic.txt
          git commit -m "chore: record upstream invariant diagnostics" || true
          git push origin HEAD:merge/upstream-20260908
