name: tmp-upstream-remerge-apply

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Carry forward previous resolved upstream integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SullyOS Upstream Merge Bot"
          git config user.email "merge-bot@users.noreply.github.com"
          git fetch origin merge/upstream-20260904
          set +e
          git merge --no-commit --no-ff c2d8fc7699025cebc6d3569026cf73b7254a9f2b
          merge_status=$?
          set -e
          unresolved="$(git diff --name-only --diff-filter=U || true)"
          expected=$'public/amsg-worker.bundle.js\nworker/amsg/worker.bundle.js'
          if [ "$merge_status" -ne 0 ] && [ "$unresolved" != "$expected" ]; then
            echo "Unexpected conflicts:"
            echo "$unresolved"
            exit 1
          fi
          if [ -n "$unresolved" ]; then
            git checkout --ours -- public/amsg-worker.bundle.js worker/amsg/worker.bundle.js
            git add public/amsg-worker.bundle.js worker/amsg/worker.bundle.js
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git add -A
          git diff --cached --check
          git commit -m "merge: carry forward upstream integration through ae0bf42"
          git push origin HEAD:merge/upstream-20260908
