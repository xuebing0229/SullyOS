name: tmp-upstream-remerge-audit

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit merge of previous resolved upstream integration
        shell: bash
        run: |
          set -u
          git config user.name "SullyOS Upstream Merge Audit"
          git config user.email "merge-audit@users.noreply.github.com"
          git fetch origin merge/upstream-20260904
          set +e
          git merge --no-commit --no-ff c2d8fc7699025cebc6d3569026cf73b7254a9f2b
          status=$?
          set -e
          {
            echo "merge_exit=$status"
            echo "=== UNRESOLVED FILES ==="
            git diff --name-only --diff-filter=U || true
            echo "=== CONFLICT COUNTS ==="
            git diff --name-only --diff-filter=U | while read -r f; do
              [ -n "$f" ] || continue
              printf '%s\t' "$f"
              grep -c '^<<<<<<< ' "$f" || true
            done
          } > /tmp/upstream-remerge-audit.txt
          cat /tmp/upstream-remerge-audit.txt
          git merge --abort >/dev/null 2>&1 || true
          cp /tmp/upstream-remerge-audit.txt .github/tmp-upstream-remerge-audit.txt
          git add .github/tmp-upstream-remerge-audit.txt
          git commit -m "chore: record upstream remerge conflict audit" || true
          git push origin HEAD:merge/upstream-20260908
