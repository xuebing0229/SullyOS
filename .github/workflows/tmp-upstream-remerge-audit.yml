name: tmp-upstream-conflict-details

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture semantic conflict blocks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SullyOS Upstream Merge Audit"
          git config user.email "merge-audit@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git 2>/dev/null || git remote set-url upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master
          set +e
          git merge --no-commit --no-ff upstream/master
          set -e
          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines()
          out = []
          for rel in files:
              text = Path(rel).read_text(errors='replace').splitlines()
              out.append(f'\n######## {rel} ########')
              i = 0
              block = 0
              while i < len(text):
                  if text[i].startswith('<<<<<<< '):
                      block += 1
                      start = i
                      j = i + 1
                      while j < len(text) and not text[j].startswith('>>>>>>> '):
                          j += 1
                      end = min(j, len(text)-1)
                      lo = max(0, start - 8)
                      hi = min(len(text), end + 9)
                      out.append(f'\n--- conflict {block}, lines {start+1}-{end+1} ---')
                      out.extend(f'{n+1:05d}: {text[n]}' for n in range(lo, hi))
                      i = end + 1
                  else:
                      i += 1
          Path('/tmp/upstream-conflict-details.txt').write_text('\n'.join(out) + '\n')
          PY
          cat /tmp/upstream-conflict-details.txt
          git merge --abort >/dev/null 2>&1 || true
          cp /tmp/upstream-conflict-details.txt .github/tmp-upstream-conflict-details.txt
          git add .github/tmp-upstream-conflict-details.txt
          git commit -m "chore: record upstream conflict details" || true
          git push origin HEAD:merge/upstream-20260908
