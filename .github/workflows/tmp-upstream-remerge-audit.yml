name: tmp-upstream-integration-verify

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify preserved fork invariants
        run: |
          pnpm run verify:upstream-merge
          grep -q 'const OUTBOUND_ANALYTICS_DISABLED = true' utils/analytics.ts
          grep -q 'if (OUTBOUND_ANALYTICS_DISABLED) return;' utils/analytics.ts
          grep -q 'replaceStoryTheaterReply' components/date/story/StoryTheaterSession.tsx
          grep -q "theaterRequestKey: activeRequestKey" components/date/story/StoryTheaterSession.tsx
          grep -q 'cancelStoryGenerationByOwner' components/date/story/StoryTheaterSession.tsx
          grep -q 'executeStoryCompletionInCloudBackground' components/date/story/StoryTheaterSession.tsx
          grep -q 'executeStoryCompletionInNativeBackground' components/date/story/StoryTheaterSession.tsx
          grep -q 'group?: string' types.ts
          grep -q 'section?:' types.ts

      - name: Run full test suite
        run: pnpm test:run

      - name: Production build and regenerate workers
        run: pnpm run build

      - name: Commit regenerated worker bundles if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SullyOS Upstream Merge Bot"
          git config user.email "merge-bot@users.noreply.github.com"
          changed="$(git status --short)"
          echo "$changed"
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(public/amsg-worker\.bundle\.js|worker/amsg/worker\.bundle\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected tracked/generated changes after build:"
            echo "$unexpected"
            exit 1
          fi
          if ! git diff --quiet -- public/amsg-worker.bundle.js worker/amsg/worker.bundle.js; then
            git add public/amsg-worker.bundle.js worker/amsg/worker.bundle.js
            git diff --cached --check
            git commit -m "build: regenerate worker bundles after upstream integration"
            git push origin HEAD:merge/upstream-20260908
          fi
