name: tmp-upstream-latest-audit

on:
  push:
    branches:
      - merge/upstream-20260908
    paths:
      - .github/workflows/tmp-upstream-remerge-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit latest upstream merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SullyOS Upstream Merge Audit"
          git config user.email "merge-audit@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git 2>/dev/null || git remote set-url upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master
          upstream_sha="$(git rev-parse upstream/master)"
          set +e
          git merge --no-commit --no-ff upstream/master
          merge_status=$?
          set -e
          {
            echo "upstream_sha=$upstream_sha"
            echo "merge_exit=$merge_status"
            echo "=== UNRESOLVED FILES ==="
            git diff --name-only --diff-filter=U || true
            echo "=== CONFLICT COUNTS ==="
            git diff --name-only --diff-filter=U | while read -r f; do
              [ -n "$f" ] || continue
              printf '%s\t' "$f"
              grep -c '^<<<<<<< ' "$f" || true
            done
            echo "=== STAGED FILE COUNT ==="
            git diff --cached --name-only | wc -l
          } > /tmp/upstream-latest-audit.txt
          cat /tmp/upstream-latest-audit.txt
          git merge --abort >/dev/null 2>&1 || true
          cp /tmp/upstream-latest-audit.txt .github/tmp-upstream-latest-audit.txt
          git add .github/tmp-upstream-latest-audit.txt
          git commit -m "chore: record latest upstream merge audit" || true
          git push origin HEAD:merge/upstream-20260908
