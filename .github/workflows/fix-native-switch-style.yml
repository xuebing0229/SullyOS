name: Fix native switch style

on:
  push:
    branches:
      - fix/reuse-native-switch-style

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reuse-native-switch-style
      - name: Reuse existing switch pattern
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/Settings.tsx')
          s = p.read_text()
          marker = 'setApiPresetModelStorySystemCompatibility(preset, pricingModel, !enabled);'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('target switch marker not found')
          start = s.rfind('<button', 0, pos)
          end = s.find('</button>', pos)
          if start < 0 or end < 0:
              raise SystemExit('target switch boundaries not found')
          end += len('</button>')
          line_start = s.rfind('\n', 0, start) + 1
          indent = s[line_start:start]
          i1 = indent + '    '
          i2 = indent + '        '
          new = '\n'.join([
              indent + '<label className="relative inline-flex items-center cursor-pointer shrink-0">',
              i1 + '<input',
              i2 + 'type="checkbox"',
              i2 + 'checked={enabled}',
              i2 + 'onChange={event => {',
              i2 + '    const updated = setApiPresetModelStorySystemCompatibility(preset, pricingModel, event.target.checked);',
              i2 + '    updateApiPreset(preset.id, { models: updated.models });',
              i2 + '}}',
              i2 + 'className="sr-only peer"',
              i1 + '/>',
              i1 + '<div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[\'\'] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-violet-500"></div>',
              indent + '</label>',
          ])
          p.write_text(s[:start] + new + s[end:])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/Settings.tsx
          git commit -m "fix: reuse native switch style" || exit 0
          git push
