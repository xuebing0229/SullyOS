name: Apply story dialogue format once

on:
  push:
    paths:
      - '.github/workflows/story-dialogue-format-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply dialogue format protocol
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          session_path = Path('components/date/story/StoryTheaterSession.tsx')
          session = session_path.read_text(encoding='utf-8')
          fn = session.index('const splitStoryToneSegments =')
          pattern_start = session.index('    const pattern = /', fn)
          segments_start = session.index('    const segments:', pattern_start)
          session = (
              session[:pattern_start]
              + "    const pattern = /(\\*(?!\\*)[^*\\n]+?\\*|「[^」\\n]*」)/g;\n"
              + session[segments_start:]
          )
          session_path.write_text(session, encoding='utf-8')

          story_path = Path('utils/storyTheater.ts')
          story = story_path.read_text(encoding='utf-8')
          lines = story.splitlines()
          hits = [i for i, line in enumerate(lines) if '【对白】' in line and ('中文引号' in line or '成对引号' in line)]
          if len(hits) != 1:
              raise SystemExit(f'expected exactly one text-tone dialogue rule, got {len(hits)}')
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i:i+1] = [
              indent + "'【对白】人物真实说出口的话一律使用「……」；只有「……」被视为对白。',",
              indent + "'【普通引用】“……”、『……』、‘……’、英文引号等保持普通正文含义，可用于专名、标题、引用和强调；它们不是对白，不参与对白着色。',",
          ]
          story_path.write_text('\n'.join(lines) + ('\n' if story.endswith('\n') else ''), encoding='utf-8')

          # Guardrails: only corner quotes may create dialogue segments now.
          updated_session = session_path.read_text(encoding='utf-8')
          tone_region = updated_session[updated_session.index('const splitStoryToneSegments ='):]
          tone_region = tone_region[:tone_region.index('const splitStoryParagraphs') if 'const splitStoryParagraphs' in tone_region else 2500]
          if '“[^”' in tone_region or '『[^』' in tone_region or '\"[^\"' in tone_region:
              raise SystemExit('old quote styles still participate in Story tone dialogue parsing')
          if '「[^」\\n]*」' not in tone_region:
              raise SystemExit('corner-quote dialogue parser missing')
          PY

      - name: Verify main chat untouched
        shell: bash
        run: |
          test -z "$(git diff -- components/chat/MessageItem.tsx)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Commit final source and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/story-dialogue-format-once.yml
          git add components/date/story/StoryTheaterSession.tsx utils/storyTheater.ts
          git commit -m "fix(story): use corner quotes as dialogue protocol"
          git push origin HEAD:master
