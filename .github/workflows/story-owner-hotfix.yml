name: Story owner hotfix

on:
  push:
    branches:
      - fix/story-request-owner-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-request-owner-20260906
          fetch-depth: 0

      - name: Apply narrow story owner patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_one(path, label, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              print(f'{label}: {count} match(es)')
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, label, anchor, addition):
              replace_one(path, label, anchor, addition + anchor)

          cloud_helpers = dedent('''
          const pendingCloudStoryBelongsToEntry = (
              pending: PendingCloudStoryJob,
              entryId: string,
          ): boolean => {
              const ownerKey = String(pending?.ownerKey || '');
              return String(pending?.meta?.storyEntryId || '') === entryId
                  || ownerKey === `story-turn:${entryId}`
                  || ownerKey.startsWith(`story-turn:${entryId}:`)
                  || ownerKey.startsWith(`story-reroll:${entryId}:`)
                  || ownerKey === `story-opening:${entryId}`;
          };

          export const findPendingCloudStoryJobForStory = (
              entryId: string,
          ): PendingCloudStoryJob | null => {
              const normalizedEntryId = String(entryId || '').trim();
              if (!normalizedEntryId) return null;
              const pending = Object.values(readPendingMap())
                  .filter(item => item?.jobId && item?.clientRequestId && pendingCloudStoryBelongsToEntry(item, normalizedEntryId))
                  .sort((left, right) => Number(right.createdAt || 0) - Number(left.createdAt || 0));
              return pending[0] || null;
          };

          export const clearOtherPendingCloudStoryJobsForStory = async (
              entryId: string,
              keepOwnerKey: string,
          ): Promise<void> => {
              const normalizedEntryId = String(entryId || '').trim();
              if (!normalizedEntryId) return;
              const map = readPendingMap();
              let changed = false;
              for (const [ownerKey, pending] of Object.entries(map)) {
                  if (ownerKey === keepOwnerKey) continue;
                  if (!pendingCloudStoryBelongsToEntry(pending, normalizedEntryId)) continue;
                  delete map[ownerKey];
                  changed = true;
              }
              if (changed) writePendingMap(map);
          };

          ''')
          insert_before(
              'utils/backgroundStoryJobs.ts',
              'cloud helper insertion',
              'const savePendingCloudStoryJob = (pending: PendingCloudStoryJob): void => {\n',
              cloud_helpers,
          )

          native_helpers = dedent('''
          const pendingNativeStoryBelongsToEntry = (
            pending: PendingNativeStoryJob,
            entryId: string,
          ): boolean => {
            const ownerKey = String(pending?.ownerKey || '');
            return String(pending?.meta?.storyEntryId || '') === entryId
              || ownerKey === `story-turn:${entryId}`
              || ownerKey.startsWith(`story-turn:${entryId}:`)
              || ownerKey.startsWith(`story-reroll:${entryId}:`)
              || ownerKey === `story-opening:${entryId}`;
          };

          export const findPendingNativeStoryJobForStory = (
            entryId: string,
          ): PendingNativeStoryJob | null => {
            const normalizedEntryId = String(entryId || '').trim();
            if (!normalizedEntryId) return null;
            const pending = Object.values(readPending())
              .filter(item => item?.jobId && pendingNativeStoryBelongsToEntry(item, normalizedEntryId))
              .sort((left, right) => Number(right.createdAt || 0) - Number(left.createdAt || 0));
            return pending[0] || null;
          };

          export const clearOtherPendingNativeStoryJobsForStory = async (
            entryId: string,
            keepOwnerKey: string,
          ): Promise<void> => {
            const normalizedEntryId = String(entryId || '').trim();
            if (!normalizedEntryId) return;
            const map = readPending();
            let changed = false;
            for (const [ownerKey, pending] of Object.entries(map)) {
              if (ownerKey === keepOwnerKey) continue;
              if (!pendingNativeStoryBelongsToEntry(pending, normalizedEntryId)) continue;
              delete map[ownerKey];
              changed = true;
            }
            if (changed) writePending(map);
          };

          ''')
          insert_before(
              'utils/nativeStoryBackground.ts',
              'native helper insertion',
              'export const isNativeStoryBackgroundRuntime = (): boolean =>\n',
              native_helpers,
          )

          story = 'components/date/story/StoryTheaterSession.tsx'
          replace_one(
              story,
              'native import clear helper',
              '    clearPendingNativeStoryJob,\n',
              '    clearOtherPendingNativeStoryJobsForStory,\n    clearPendingNativeStoryJob,\n',
          )
          replace_one(
              story,
              'native import find helper',
              '    getPendingNativeStoryJob,\n',
              '    findPendingNativeStoryJobForStory,\n    getPendingNativeStoryJob,\n',
          )
          replace_one(
              story,
              'cloud import clear helper',
              '    clearPendingCloudStoryJob,\n',
              '    clearOtherPendingCloudStoryJobsForStory,\n    clearPendingCloudStoryJob,\n',
          )
          replace_one(
              story,
              'cloud import find helper',
              '    getPendingCloudStoryJob,\n',
              '    findPendingCloudStoryJobForStory,\n    getPendingCloudStoryJob,\n',
          )
          replace_one(
              story,
              'main job delayed cloud clear',
              "                && !background.ownerKey.startsWith('story-turn:')\n",
              '                && !background.meta?.storyRequestKey\n',
          )
          replace_one(
              story,
              'send recovery owner parameter',
              '    const send = useCallback(async (rerollTarget?: Message, continueRequested = false) => {\n',
              '    const send = useCallback(async (rerollTarget?: Message, continueRequested = false, recoveryOwnerKey?: string) => {\n',
          )
          replace_one(
              story,
              'request-scoped owner variable',
              '        const backgroundOwnerKey = `story-turn:${entry.id}`;\n',
              "        let backgroundOwnerKey = '';\n",
          )
          replace_one(
              story,
              'deferred recovery check',
              '        const recoveringCloudPending = Boolean(getPendingCloudStoryJob(backgroundOwnerKey));\n',
              '        let recoveringCloudPending = false;\n',
          )
          replace_one(
              story,
              'bind owner after request key',
              '                        : `story-turn:${entry.id}:${makeStoryTheaterId()}`;\n',
              dedent('''
                                      : `story-turn:${entry.id}:${makeStoryTheaterId()}`;
                          // 每一轮正文拥有独立 owner。只有自动恢复旧任务时才显式沿用原 owner，
                          // 这样切换剧情 API 后的新一轮不会被上一轮 pending 劫持回旧上游。
                          backgroundOwnerKey = recoveryOwnerKey || activeRequestKey;
                          recoveringCloudPending = Boolean(getPendingCloudStoryJob(backgroundOwnerKey));
                          if (!recoveryOwnerKey) {
                              await clearOtherPendingCloudStoryJobsForStory(entry.id, backgroundOwnerKey);
                              if (isNativeStoryBackgroundRuntime()) {
                                  await clearOtherPendingNativeStoryJobsForStory(entry.id, backgroundOwnerKey);
                              }
                          }
              ''').replace('            : `story-turn', '                        : `story-turn', 1).replace('\n// 每一轮', '\n            // 每一轮').replace('\n// 这样', '\n            // 这样').replace('\nbackgroundOwnerKey', '\n            backgroundOwnerKey').replace('\nrecoveringCloudPending', '\n            recoveringCloudPending').replace('\nif (!recoveryOwnerKey)', '\n            if (!recoveryOwnerKey)').replace('\n    await clearOtherPendingCloudStoryJobsForStory', '\n                await clearOtherPendingCloudStoryJobsForStory').replace('\n    if (isNativeStoryBackgroundRuntime())', '\n                if (isNativeStoryBackgroundRuntime())').replace('\n        await clearOtherPendingNativeStoryJobsForStory', '\n                    await clearOtherPendingNativeStoryJobsForStory').replace('\n    }', '\n                }').replace('\n}', '\n            }'),
          )
          replace_one(
              story,
              'story request metadata',
              '                    ...(isReroll && rerollTarget ? { rerollTargetId: rerollTarget.id } : {}),\n',
              '                    storyEntryId: entry.id,\n                    storyRequestKey: activeRequestKey,\n                    ...(isReroll && rerollTarget ? { rerollTargetId: rerollTarget.id } : {}),\n',
          )
          replace_one(
              story,
              'drop legacy static recovery owner',
              '        const ownerKey = `story-turn:${entry.id}`;\n',
              '',
          )
          replace_one(
              story,
              'find cloud pending by story',
              '        const cloudPending = getPendingCloudStoryJob(ownerKey);\n',
              '        const cloudPending = findPendingCloudStoryJobForStory(entry.id);\n',
          )
          replace_one(
              story,
              'find native pending by story',
              '            ? getPendingNativeStoryJob(ownerKey)\n',
              '            ? findPendingNativeStoryJobForStory(entry.id)\n',
          )
          replace_one(
              story,
              'recover exact pending owner',
              '            if (!cancelled) void send(rerollTarget);\n',
              '            if (!cancelled) void send(rerollTarget, false, pending.ownerKey);\n',
          )
          PY

      - name: Validate TypeScript build
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Commit narrow patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/story-owner-hotfix.yml
          git add components/date/story/StoryTheaterSession.tsx utils/backgroundStoryJobs.ts utils/nativeStoryBackground.ts
          git diff --cached --check
          git commit -m "fix: isolate story background jobs per request"
          git push origin HEAD:fix/story-request-owner-20260906
