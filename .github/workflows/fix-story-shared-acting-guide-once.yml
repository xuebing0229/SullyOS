name: Fix Story shared acting guide once

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-story-shared-acting-guide-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Story-only acting guide integration
        run: python .github/scripts/fix-story-shared-acting-guide.py

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- components/chat/MessageItem.tsx
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          while IFS= read -r path; do
            case "$path" in
              components/date/story/StoryTheaterSession.tsx|utils/storyTheaterVoice.ts|utils/storyTheaterVoice.test.ts) ;;
              *) echo "Unexpected changed file: $path"; exit 1 ;;
            esac
          done <<< "$CHANGED"
          grep -q "VOICE_ACTING_GUIDE" utils/storyTheaterVoice.ts
          grep -q "theaterVoiceActing" components/date/story/StoryTheaterSession.tsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Story voice tests
        run: pnpm exec vitest run utils/storyTheaterVoice.test.ts

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build web app
        run: pnpm run build

      - name: Commit verified source fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx utils/storyTheaterVoice.ts utils/storyTheaterVoice.test.ts
          git rm .github/scripts/fix-story-shared-acting-guide.py .github/workflows/fix-story-shared-acting-guide-once.yml
          git commit -m "fix(story): reuse shared acting guide for dialogue TTS"
          git push origin HEAD:master
