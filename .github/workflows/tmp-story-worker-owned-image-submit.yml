name: Temporary worker-owned story image submission patch

on:
  push:
    paths:
      - '.github/workflows/tmp-story-worker-owned-image-submit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_story_worker_owned_image_submit.py
      - name: Verify diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/backgroundImageJobs.ts
          git commit -m "fix: make story worker sole automatic image submitter"
          git push origin master
