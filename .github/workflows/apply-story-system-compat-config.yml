name: Apply story system compatibility config

on:
  push:
    branches: [master]
    paths:
      - scripts/apply-story-system-compat-config.mjs
      - .github/workflows/apply-story-system-compat-config.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply exact source patches
        run: node scripts/apply-story-system-compat-config.mjs

      - name: Verify patch
        run: |
          git diff --check
          git diff --exit-code -- scripts/apply-story-system-compat-config.mjs .github/workflows/apply-story-system-compat-config.yml || true
          test -n "$(git status --porcelain -- utils/backgroundStoryJobs.ts utils/storyTheaterImage.ts components/date/story/StoryTheaterSession.tsx worker/amsg/src/storyImageHandoff.ts apps/Settings.tsx)"

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/backgroundStoryJobs.ts utils/storyTheaterImage.ts components/date/story/StoryTheaterSession.tsx worker/amsg/src/storyImageHandoff.ts apps/Settings.tsx
          git commit -m "feat(story): configure system compatibility per preset model"
          git push origin HEAD:master
