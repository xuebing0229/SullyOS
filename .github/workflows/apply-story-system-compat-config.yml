name: Apply story direct egress cleanup

on:
  push:
    branches: [master]
    paths:
      - scripts/apply-story-system-compat-config.mjs
      - .github/workflows/apply-story-system-compat-config.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Remove temporary Japanese story relay routing
        run: node scripts/apply-story-system-compat-config.mjs

      - name: Verify exact patch
        run: |
          git diff --check
          grep -q "all story text.*direct" /dev/null 2>/dev/null || true
          grep -q "return { url: targetUrl, relayed: false }" worker/amsg/src/storyEgress.ts
          grep -q "ignores legacy relay config" worker/amsg/src/storyEgress.test.ts
          ! grep -q "X-Sully-Egress-Target'" worker/amsg/src/storyEgress.ts
          test -n "$(git status --porcelain -- worker/amsg/src/storyEgress.ts worker/amsg/src/storyEgress.test.ts)"

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/amsg/src/storyEgress.ts worker/amsg/src/storyEgress.test.ts
          git commit -m "fix(story): remove temporary Japanese relay"
          git push origin HEAD:master
