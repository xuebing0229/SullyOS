name: tmp-upstream-merge-plan

on:
  push:
    branches:
      - merge/upstream-20260904
    paths:
      - .github/workflows/tmp-upstream-merge-plan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge fixed upstream and resolve semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_UPSTREAM="ae0bf420c0093a77de1d8d570b9f96452c03d263"
          git config user.name "SullyOS Upstream Merge Bot"
          git config user.email "merge-bot@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git 2>/dev/null || git remote set-url upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master
          git cat-file -e "${LOCKED_UPSTREAM}^{commit}"
          git merge-base --is-ancestor "$LOCKED_UPSTREAM" upstream/master
          git update-ref refs/remotes/upstream/master "$LOCKED_UPSTREAM"
          git merge --no-commit --no-ff upstream/master || true
          python scripts/tmp-resolve-upstream-merge.py
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved files:"
            echo "$unresolved"
            exit 1
          fi
          if grep -RIl '^<<<<<<< HEAD' apps components utils types.ts >/tmp/conflict-markers.txt 2>/dev/null; then
            cat /tmp/conflict-markers.txt
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run merge regression tests
        run: |
          pnpm exec vitest run \
            utils/mcpClient.test.ts \
            utils/mcpFireCore.test.ts \
            utils/mcpExecutionPolicy.test.ts \
            utils/mcpImagePersistence.test.ts \
            utils/chatRequestPayload.test.ts \
            utils/activeMsgRuntime.test.ts \
            utils/amsg2ScheduleRestraint.test.ts \
            utils/storyTheater.test.ts \
            utils/sanitize.test.ts \
            utils/collaborationApi.test.ts \
            utils/collaborationContext.test.ts \
            utils/collaborationWiring.test.ts

      - name: Run full test suite
        run: pnpm test:run

      - name: Build production app
        run: pnpm run build

      - name: Validate diff and commit staging merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git rm -f .github/workflows/tmp-upstream-merge-plan.yml scripts/tmp-resolve-upstream-merge.py
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "merge: sync upstream through ae0bf42 with fork features preserved"
          git push origin HEAD:merge/upstream-20260904
