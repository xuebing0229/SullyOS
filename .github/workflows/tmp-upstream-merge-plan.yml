name: tmp-upstream-merge-plan

on:
  push:
    branches:
      - merge/upstream-20260904
    paths:
      - .github/workflows/tmp-upstream-merge-plan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge fixed upstream and resolve semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_UPSTREAM="ae0bf420c0093a77de1d8d570b9f96452c03d263"
          git config user.name "SullyOS Upstream Merge Bot"
          git config user.email "merge-bot@users.noreply.github.com"
          git remote add upstream https://github.com/qegj567-cloud/SullyOS.git 2>/dev/null || git remote set-url upstream https://github.com/qegj567-cloud/SullyOS.git
          git fetch upstream master
          git cat-file -e "${LOCKED_UPSTREAM}^{commit}"
          git merge-base --is-ancestor "$LOCKED_UPSTREAM" upstream/master
          git update-ref refs/remotes/upstream/master "$LOCKED_UPSTREAM"
          git merge --no-commit --no-ff upstream/master || true
          python scripts/tmp-resolve-upstream-merge.py
          python - <<'PY'
          from pathlib import Path

          bridge_path = Path('utils/mcpToolBridge.ts')
          bridge = bridge_path.read_text()
          old = '用户请求与某个工具匹配时，必须调用，不要改成口头描述。调用时只输出一行严格格式 tool_name({"参数":"值"})，不要加代码块、解释、道歉或其他文字；客户端会识别并执行。没有收到客户端返回前，不得声称成功。'
          new = '用户请求与某个工具匹配时，必须调用，不要改成口头描述。每一步如果需要工具，只输出一行严格格式 tool_name({"参数":"值"})，不要加代码块、解释、道歉或其他文字；客户端会识别并执行后把结果返回给你。收到结果后，若任务还没完成就选择下一步真正能推进目标的工具，不要反复读取同一份说明或状态。没有收到客户端返回前，不得声称成功。'
          if old not in bridge:
              raise RuntimeError('MCP text fallback prompt anchor not found')
          bridge_path.write_text(bridge.replace(old, new, 1))

          test_path = Path('utils/mcpClient.test.ts')
          test = test_path.read_text()
          old_schema = """        expect(novel?.function.parameters.properties).not.toHaveProperty('use_character_reference');
                  expect(novel?.function.parameters.properties).toHaveProperty('use_user_reference');
          """
          new_schema = """        expect(novel?.function.parameters.properties).not.toHaveProperty('use_character_reference');
                  expect(novel?.function.parameters.properties).not.toHaveProperty('use_user_reference');
          """
          if old_schema not in test:
              raise RuntimeError('NovelAI schema regression assertion anchor not found')
          test = test.replace(old_schema, new_schema, 1)
          old_block = """        expect(block).not.toContain('当前角色参考图');
                  expect(block).not.toContain('use_character_reference');
                  expect(block).toContain('use_user_reference');
          """
          new_block = """        expect(block).not.toContain('当前角色参考图');
                  expect(block).not.toContain('use_character_reference');
                  expect(block).not.toContain('use_user_reference');
          """
          if old_block not in test:
              raise RuntimeError('NovelAI prompt regression assertion anchor not found')
          test_path.write_text(test.replace(old_block, new_block, 1))
          PY
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved files:"
            echo "$unresolved"
            exit 1
          fi
          if grep -RIl '^<<<<<<< HEAD' apps components utils types.ts >/tmp/conflict-markers.txt 2>/dev/null; then
            cat /tmp/conflict-markers.txt
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mcpClient
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm exec vitest run utils/mcpClient.test.ts 2>&1 | tee /tmp/mcpClient-vitest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            encoded="$(base64 -w0 /tmp/mcpClient-vitest.log)"
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/contents/.github/tmp-upstream-test-failure.log" \
              -f message='ci: capture mcpClient regression failure' \
              -f content="$encoded" \
              -f branch='merge/upstream-20260904'
            exit "$status"
          fi
      - name: Test mcpFireCore
        run: pnpm exec vitest run utils/mcpFireCore.test.ts
      - name: Test mcpExecutionPolicy
        run: pnpm exec vitest run utils/mcpExecutionPolicy.test.ts
      - name: Test mcpImagePersistence
        run: pnpm exec vitest run utils/mcpImagePersistence.test.ts
      - name: Test chatRequestPayload
        run: pnpm exec vitest run utils/chatRequestPayload.test.ts
      - name: Test activeMsgRuntime
        run: pnpm exec vitest run utils/activeMsgRuntime.test.ts
      - name: Test amsg2ScheduleRestraint
        run: pnpm exec vitest run utils/amsg2ScheduleRestraint.test.ts
      - name: Test storyTheater
        run: pnpm exec vitest run utils/storyTheater.test.ts
      - name: Test sanitize
        run: pnpm exec vitest run utils/sanitize.test.ts
      - name: Test collaborationApi
        run: pnpm exec vitest run utils/collaborationApi.test.ts
      - name: Test collaborationContext
        run: pnpm exec vitest run utils/collaborationContext.test.ts
      - name: Test collaborationWiring
        run: pnpm exec vitest run utils/collaborationWiring.test.ts

      - name: Run full test suite
        run: pnpm test:run

      - name: Build production app
        run: pnpm run build

      - name: Validate diff and commit staging merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git rm -f .github/workflows/tmp-upstream-merge-plan.yml scripts/tmp-resolve-upstream-merge.py
          git rm -f .github/tmp-upstream-test-failure.log 2>/dev/null || true
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "merge: sync upstream through ae0bf42 with fork features preserved"
          git push origin HEAD:merge/upstream-20260904
