name: Fix story inline image plan type

on:
  push:
    branches: [feat/story-inline-image-plan]
    paths:
      - '.github/workflows/fix-story-inline-image-plan-type.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/story-inline-image-plan
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply type patch
        run: node scripts/fix-story-inline-image-plan-type.mjs
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(story): keep inline plan union typed"
          git push origin HEAD:feat/story-inline-image-plan
