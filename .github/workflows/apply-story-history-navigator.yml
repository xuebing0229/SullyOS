name: Apply Story History Navigator

on:
  push:
    branches:
      - 'fix/story-history-navigator'
    paths:
      - '.github/workflows/apply-story-history-navigator.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/story-history-navigator

      - name: Wire searchable story history
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('components/date/story/StoryTheaterSession.tsx')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global source
              count = source.count(old)
              assert count == 1, f'{label}: expected 1 match, got {count}'
              source = source.replace(old, new, 1)

          replace_once(
              "import StoryQuickPresetPanel from './StoryQuickPresetPanel';\n",
              "import StoryQuickPresetPanel from './StoryQuickPresetPanel';\nimport StoryHistoryPreview from './StoryHistoryPreview';\n",
              'history import',
          )

          replace_once(
              "    const [expandedArchivedIds, setExpandedArchivedIds] = useState<Set<number>>(() => new Set());\n",
              "    const [showHistoryPreview, setShowHistoryPreview] = useState(false);\n    const [historySpotlightId, setHistorySpotlightId] = useState<number | null>(null);\n",
              'history state',
          )

          replace_once(
              "    const bottomRef = useRef<HTMLDivElement>(null);\n",
              "    const bottomRef = useRef<HTMLDivElement>(null);\n    const storyMessageElementsRef = useRef<Map<number, HTMLElement>>(new Map());\n    const pendingHistoryJumpRef = useRef<number | null>(null);\n",
              'history refs',
          )

          replace_once(
              "        setExpandedArchivedIds(new Set());\n",
              "        setShowHistoryPreview(false);\n        setHistorySpotlightId(null);\n        storyMessageElementsRef.current.clear();\n        pendingHistoryJumpRef.current = null;\n",
              'entry reset',
          )

          replace_once(
              "            // Android 返回键遵循“最上层先退”的顺序，不再直接把整个文游 App 关掉。\n            if (branchingMessage) {",
              "            // Android 返回键遵循“最上层先退”的顺序，不再直接把整个文游 App 关掉。\n            if (showHistoryPreview) {\n                setShowHistoryPreview(false);\n                return true;\n            }\n            if (branchingMessage) {",
              'back handler',
          )

          replace_once(
              "        showHeaderMenu,\n        showMemoryCards,\n        showQuickPreset,\n",
              "        showHeaderMenu,\n        showHistoryPreview,\n        showMemoryCards,\n        showQuickPreset,\n",
              'back deps',
          )

          old_archive_helpers = """    const allArchivesExpanded = archivedMessageIds.length > 0 && archivedMessageIds.every(id => expandedArchivedIds.has(id));
    const toggleAllArchives = useCallback(() => {
        setExpandedArchivedIds(current => {
            const next = new Set(current);
            if (archivedMessageIds.every(id => next.has(id))) archivedMessageIds.forEach(id => next.delete(id));
            else archivedMessageIds.forEach(id => next.add(id));
            return next;
        });
    }, [archivedMessageIds]);
    const setArchiveExpanded = useCallback((messageId: number, open: boolean) => {
        setExpandedArchivedIds(current => {
            if (current.has(messageId) === open) return current;
            const next = new Set(current);
            if (open) next.add(messageId);
            else next.delete(messageId);
            return next;
        });
    }, []);
"""
          new_archive_helpers = """    const archivedMessageIdSet = useMemo(() => new Set(archivedMessageIds), [archivedMessageIds]);
    const setStoryMessageElement = useCallback((messageId: number, element: HTMLElement | null) => {
        if (element) storyMessageElementsRef.current.set(messageId, element);
        else storyMessageElementsRef.current.delete(messageId);
    }, []);
    const jumpToHistoryMessage = useCallback((message: Message) => {
        autoFollowStreamRef.current = false;
        initialBottomFollowRef.current = false;
        pendingHistoryJumpRef.current = message.id;
        setHistorySpotlightId(mirrorArchived(message, entry) ? message.id : null);
        setShowHistoryPreview(false);
    }, [entry]);
    useEffect(() => {
        if (showHistoryPreview) return;
        const messageId = pendingHistoryJumpRef.current;
        if (!messageId) return;

        let cancelled = false;
        let frame = 0;
        let attempts = 0;
        const jump = () => {
            if (cancelled) return;
            const element = storyMessageElementsRef.current.get(messageId);
            if (element) {
                element.scrollIntoView({ behavior: 'auto', block: 'center' });
                pendingHistoryJumpRef.current = null;
                return;
            }
            attempts += 1;
            if (attempts < 10) frame = requestAnimationFrame(jump);
        };
        frame = requestAnimationFrame(jump);
        return () => {
            cancelled = true;
            cancelAnimationFrame(frame);
        };
    }, [historySpotlightId, messages.length, showHistoryPreview]);
"""
          replace_once(old_archive_helpers, new_archive_helpers, 'archive helpers')

          replace_once(
              "    const archivedCount = messages.filter(message => mirrorArchived(message, entry)).length;\n",
              "",
              'archived count',
          )

          memory_panel = """        {showMemoryCards && memoryActors[0] && (
            <AppMemoryCandidatePanel
                candidates={memoryCandidates}
                char={memoryActors[0]}
                characters={memoryActors}
                userProfile={userProfile}
                memoryPalaceConfig={memoryPalaceConfig}
                remoteVectorConfig={remoteVectorConfig}
                updateCharacter={updateCharacter}
                addToast={addToast}
                onChange={setMemoryCandidates}
                onClose={() => setShowMemoryCards(false)}
            />
        )}

"""
          history_panel = memory_panel + """        {showHistoryPreview && <StoryHistoryPreview
            title={entry.title}
            messages={messages}
            archivedIds={archivedMessageIdSet}
            onClose={() => setShowHistoryPreview(false)}
            onJump={jumpToHistoryMessage}
        />}

"""
          replace_once(memory_panel, history_panel, 'history panel mount')

          old_archive_bar = """                {archivedMessageIds.length > 0 && <div className='mb-7 px-1 flex items-center justify-between gap-3 text-[9px] text-slate-400'><span>{archivedMessageIds.length} 条归档原文 · 默认折叠，整段上下滑动浏览</span><button onClick={toggleAllArchives} className='shrink-0 px-3 py-1.5 rounded-full bg-white border border-slate-200 font-bold text-violet-600'>{allArchivesExpanded ? '全部收起' : '全部展开'}</button></div>}
"""
          new_archive_bar = """                {archivedMessageIds.length > 0 && <button type='button' onClick={() => setShowHistoryPreview(true)} className='mb-7 w-full rounded-2xl border border-violet-200 bg-white px-4 py-3 text-left shadow-sm active:scale-[.99] transition-transform'>
                    <span className='flex items-center gap-3'>
                        <span className='w-9 h-9 shrink-0 rounded-full bg-violet-100 text-violet-600 grid place-items-center'><Archive size={16} /></span>
                        <span className='min-w-0 flex-1'>
                            <strong className='block text-[11px] font-bold text-slate-700'>历史剧情 · 已归档 {archivedMessageIds.length} 条</strong>
                            <span className='mt-0.5 block truncate text-[9px] text-slate-400'>旧楼已合并收起 · 点击搜索、浏览并跳转</span>
                        </span>
                        <span className='shrink-0 text-[9px] font-bold text-violet-600'>查看</span>
                    </span>
                </button>}
"""
          replace_once(old_archive_bar, new_archive_bar, 'single archive bar')

          old_archived_render = """                        if (archived) {
                            const archiveLabel = entry.writesToCharacterMemory
                                ? '已作为正常记忆归档'
                                : message.metadata?.theaterArchiveStrategy === 'vector'
                                    ? '已存入本剧情向量分区'
                                    : '已收进剧场事件盒';
                            const isExpanded = expandedArchivedIds.has(message.id);
                            return <details key={message.id} open={isExpanded} onToggle={event => setArchiveExpanded(message.id, event.currentTarget.open)} className='group border-y border-slate-200'>
                                <summary className='list-none cursor-pointer py-3 flex items-center gap-3 text-slate-400 [&::-webkit-details-marker]:hidden'>
                                    <Archive size={13} className='shrink-0' />
                                    <span className='min-w-0 flex-1'>
                                        <strong className='block text-[10px] font-semibold tracking-wide'>{archiveLabel}</strong>
                                        <span className='block mt-0.5 text-[9px]'>{message.role === 'user' ? '你的推进' : '剧场正文'} · 展开查看原文</span>
                                    </span>
                                    <CaretDown size={14} className='shrink-0 transition-transform group-open:rotate-180' />
                                </summary>
                                {isExpanded && <div {...pressHandlersFor(message)} className='pb-5 pl-7'>
                                    {message.role === 'user'
                                        ? <p className='text-sm leading-7 text-slate-600 whitespace-pre-wrap'>{message.content}</p>
                                        : <><StoryOutput content={message.content} affinityInputs={affinityInputsFromMessage(message, actors)} /><StoryRoundImage message={message} busy={regeneratingImageId === message.id} onRegenerate={() => void regenerateStoryImage(message)} /></>}
                                </div>}
                            </details>;
                        }
                        if (message.role === 'user') return <section key={message.id} {...pressHandlersFor(message)} className='pl-4 border-l-2 border-violet-300'><div className='text-[9px] tracking-[.16em] font-bold text-violet-500'>你写下</div><p className='mt-2 text-sm leading-7 text-slate-600 whitespace-pre-wrap'>{message.content}</p></section>;
                        const isLatest = message.id === messages[messages.length - 1]?.id;
                        return <article key={message.id} {...pressHandlersFor(message)}><StoryOutput content={message.content} onChoose={choice => setInput(choice)} affinityInputs={affinityInputsFromMessage(message, actors)} /><StoryRoundImage message={message} busy={regeneratingImageId === message.id} onRegenerate={() => void regenerateStoryImage(message)} />{isLatest && <div className='mt-4 flex items-center justify-end gap-2'><span className='w-1.5 h-1.5 rounded-full bg-violet-400' /><button disabled={sending} onClick={() => void send(message)} className='inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-200 bg-white text-[10px] font-bold text-slate-500 disabled:opacity-40'>{rerollingId === message.id ? <SpinnerGap size={12} className='animate-spin' /> : <ArrowClockwise size={12} />}换一种写法</button></div>}</article>;
"""
          new_archived_render = """                        if (archived && message.id !== historySpotlightId) return null;
                        if (archived) {
                            const archiveLabel = entry.writesToCharacterMemory
                                ? '已作为正常记忆归档'
                                : message.metadata?.theaterArchiveStrategy === 'vector'
                                    ? '已存入本剧情向量分区'
                                    : '已收进剧场事件盒';
                            return <article key={message.id} ref={element => setStoryMessageElement(message.id, element)} {...pressHandlersFor(message)} className='rounded-2xl border border-violet-200 bg-violet-50/60 px-4 py-4 shadow-sm'>
                                <div className='mb-4 flex items-center gap-2 text-[9px] text-violet-600'>
                                    <Archive size={13} className='shrink-0' />
                                    <span className='min-w-0 flex-1 truncate'>历史定位 · {archiveLabel}</span>
                                    <button type='button' onClick={() => setHistorySpotlightId(null)} className='shrink-0 rounded-full border border-violet-200 bg-white px-2.5 py-1 font-bold'>收起</button>
                                </div>
                                {message.role === 'user'
                                    ? <div className='pl-4 border-l-2 border-violet-300'><div className='text-[9px] tracking-[.16em] font-bold text-violet-500'>你写下</div><p className='mt-2 text-sm leading-7 text-slate-600 whitespace-pre-wrap'>{message.content}</p></div>
                                    : <><StoryOutput content={message.content} onChoose={choice => setInput(choice)} affinityInputs={affinityInputsFromMessage(message, actors)} /><StoryRoundImage message={message} busy={regeneratingImageId === message.id} onRegenerate={() => void regenerateStoryImage(message)} /></>}
                            </article>;
                        }
                        if (message.role === 'user') return <section key={message.id} ref={element => setStoryMessageElement(message.id, element)} {...pressHandlersFor(message)} className='pl-4 border-l-2 border-violet-300'><div className='text-[9px] tracking-[.16em] font-bold text-violet-500'>你写下</div><p className='mt-2 text-sm leading-7 text-slate-600 whitespace-pre-wrap'>{message.content}</p></section>;
                        const isLatest = message.id === messages[messages.length - 1]?.id;
                        return <article key={message.id} ref={element => setStoryMessageElement(message.id, element)} {...pressHandlersFor(message)}><StoryOutput content={message.content} onChoose={choice => setInput(choice)} affinityInputs={affinityInputsFromMessage(message, actors)} /><StoryRoundImage message={message} busy={regeneratingImageId === message.id} onRegenerate={() => void regenerateStoryImage(message)} />{isLatest && <div className='mt-4 flex items-center justify-end gap-2'><span className='w-1.5 h-1.5 rounded-full bg-violet-400' /><button disabled={sending} onClick={() => void send(message)} className='inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-200 bg-white text-[10px] font-bold text-slate-500 disabled:opacity-40'>{rerollingId === message.id ? <SpinnerGap size={12} className='animate-spin' /> : <ArrowClockwise size={12} />}换一种写法</button></div>}</article>;
"""
          replace_once(old_archived_render, new_archived_render, 'archive render')

          replace_once(
              "                {archivedCount > 0 && <div className='mt-10 flex items-center justify-center gap-2 text-[9px] text-slate-400'><Archive size={13} />{archivedCount} 条旧内容已归档，仍会通过所选记忆方式参与续写</div>}\n",
              "",
              'duplicate archive footer',
          )

          assert 'expandedArchivedIds' not in source
          assert 'toggleAllArchives' not in source
          assert 'setArchiveExpanded' not in source
          assert 'historySpotlightId' in source
          assert 'StoryHistoryPreview' in source
          assert "历史剧情 · 已归档 {archivedMessageIds.length} 条" in source
          assert 'archived && message.id !== historySpotlightId' in source
          assert 'initialBottomFollowRef' in source
          assert 'ResizeObserver' in source
          path.write_text(source, encoding='utf-8')

          test_path = Path('utils/reportedIssuesRegression.wiring.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              "        expect(source).toContain('整段上下滑动浏览');\n",
              "        expect(source).toContain('StoryHistoryPreview');\n",
              1,
          )
          marker = "\n});"
          addition = r'''

    it('文游把大量归档楼层合并成单个可搜索历史入口，并能从缩略内容跳回原楼层', () => {
        const source = read('../components/date/story/StoryTheaterSession.tsx');
        const history = read('../components/date/story/StoryHistoryPreview.tsx');

        expect(source).toContain('历史剧情 · 已归档 {archivedMessageIds.length} 条');
        expect(source).toContain('setShowHistoryPreview(true)');
        expect(source).toContain('archived && message.id !== historySpotlightId');
        expect(source).toContain('pendingHistoryJumpRef');
        expect(source).not.toContain('expandedArchivedIds');
        expect(source).not.toContain('setArchiveExpanded');
        expect(history).toContain("placeholder='搜索历史剧情'");
        expect(history).toContain('storyHistorySnippet');
        expect(history).toContain('onJump(message)');
        expect(history).toContain('第 {index + 1} 楼');
    });
'''
          if '文游把大量归档楼层合并成单个可搜索历史入口' not in test:
              pos = test.rfind(marker)
              assert pos >= 0
              test = test[:pos] + addition + test[pos:]
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify source invariants
        shell: bash
        run: |
          grep -q "StoryHistoryPreview" components/date/story/StoryTheaterSession.tsx
          grep -q "历史剧情 · 已归档" components/date/story/StoryTheaterSession.tsx
          grep -q "搜索历史剧情" components/date/story/StoryHistoryPreview.tsx
          ! grep -q "expandedArchivedIds\|setArchiveExpanded\|toggleAllArchives" components/date/story/StoryTheaterSession.tsx

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run regression test and web build
        shell: bash
        run: |
          pnpm exec vitest run utils/reportedIssuesRegression.wiring.test.ts
          pnpm exec vite build

      - name: Commit feature
        shell: bash
        run: |
          rm .github/workflows/apply-story-history-navigator.yml
          git config user.name "SullyOS Fix Bot"
          git config user.email "sullyos-fix-bot@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx components/date/story/StoryHistoryPreview.tsx utils/reportedIssuesRegression.wiring.test.ts .github/workflows/apply-story-history-navigator.yml
          git commit -m "feat(story): add searchable history navigator"
          git push origin HEAD:fix/story-history-navigator
