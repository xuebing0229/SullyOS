name: Patch story cloud image handoff

on:
  push:
    branches:
      - feat/story-cloud-image-handoff
    paths:
      - '.github/workflows/patch-story-cloud-image-handoff.yml'
      - 'scripts/patch-story-cloud-image-handoff.mjs'
      - 'scripts/relax-story-cloud-patcher.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-cloud-image-handoff
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Relax one duplicate patch anchor
        run: node scripts/relax-story-cloud-patcher.mjs
      - name: Apply patch
        run: node scripts/patch-story-cloud-image-handoff.mjs
      - name: Test handoff and story regressions
        run: >-
          pnpm exec vitest run
          worker/amsg/src/storyImageHandoff.test.ts
          utils/storyTheaterImage.inlinePlan.test.ts
          utils/storyTheaterBillingSafety.wiring.test.ts
          utils/safeApi.stream.test.ts
          utils/apiFailover.test.ts
      - name: Build workers
        run: pnpm run build:workers
      - name: Build web
        run: pnpm run build
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/amsg/src/storyJobs.ts worker/amsg/src/storyImageHandoff.ts worker/amsg/src/storyImageHandoff.test.ts utils/backgroundStoryJobs.ts utils/backgroundImageJobs.ts utils/storyTheaterImage.ts components/date/story/StoryTheaterSession.tsx worker/amsg/worker.bundle.js public/amsg-worker.bundle.js utils/amsgBundleVersion.ts
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
          else
            git commit -m 'feat(story): hand image jobs off from cloud story worker'
            git push origin HEAD:feat/story-cloud-image-handoff
          fi
