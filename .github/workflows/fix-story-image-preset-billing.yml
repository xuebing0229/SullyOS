name: One-off story image preset billing fix

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/fix-story-image-preset-billing.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Billing capture may be pinned to a concrete selected preset instead of guessing active preset.
          replace_once(
              'utils/imageGenerationBilling.ts',
              """import {\n    getActiveImageGenerationPreset,\n    type ImageGenerationPricing,\n} from './imageGenerationPresets';""",
              """import {\n    getActiveImageGenerationPreset,\n    getImageGenerationPresets,\n    type ImageGenerationPricing,\n} from './imageGenerationPresets';""",
          )
          replace_once(
              'utils/imageGenerationBilling.ts',
              """export function captureImageGenerationBilling(\n    engineId: BuiltinImageEngineId,\n): ImageGenerationBillingCapture {\n    const preset = getActiveImageGenerationPreset(engineId);\n    const remote = preset?.remoteConfig as any;\n    return {\n        engineId,\n        presetId: preset?.id,\n        presetName: preset?.name || (engineId === 'novelai' ? 'NovelAI 当前配置' : 'GPT 生图当前配置'),\n        baseUrl: String(remote?.baseUrl || ''),\n        pricing: clone(preset?.pricing || {\n            enabled: false,\n            basePricePerRequestYuan: '',\n            addons: {\n                characterReference: { enabled: false, pricePerRequestYuan: '' },\n                vibeReference: { enabled: false, pricePerRequestYuan: '' },\n            },\n        }),\n    };\n}""",
              """export function captureImageGenerationBilling(\n    engineId: BuiltinImageEngineId,\n    presetId?: string,\n): ImageGenerationBillingCapture {\n    const requestedPresetId = String(presetId || '').trim();\n    const preset = requestedPresetId\n        ? getImageGenerationPresets(engineId).find(item => item.id === requestedPresetId) || null\n        : getActiveImageGenerationPreset(engineId);\n    const remote = preset?.remoteConfig as any;\n    return {\n        engineId,\n        presetId: preset?.id || (requestedPresetId || undefined),\n        presetName: preset?.name || (requestedPresetId\n            ? '已删除的生图预设'\n            : (engineId === 'novelai' ? 'NovelAI 当前配置' : 'GPT 生图当前配置')),\n        baseUrl: String(remote?.baseUrl || ''),\n        pricing: clone(preset?.pricing || {\n            enabled: false,\n            basePricePerRequestYuan: '',\n            addons: {\n                characterReference: { enabled: false, pricePerRequestYuan: '' },\n                vibeReference: { enabled: false, pricePerRequestYuan: '' },\n            },\n        }),\n    };\n}""",
          )

          # 2) Background jobs freeze and persist the actually selected preset identity.
          replace_once(
              'utils/backgroundImageJobs.ts',
              """    engineId: BuiltinImageEngineId;\n    serverId: string;\n    serverName: string;\n    controlBaseUrl: string;""",
              """    engineId: BuiltinImageEngineId;\n    serverId: string;\n    serverName: string;\n    imagePresetId?: string;\n    controlBaseUrl: string;""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """const normalizeBaseUrl = (\n    value: string,\n): string =>\n    value.trim().replace(/\\/+$/, '');\n\nconst engineIdFromServer = (""",
              """const normalizeBaseUrl = (\n    value: string,\n): string =>\n    value.trim().replace(/\\/+$/, '');\n\nconst IMAGE_PRESET_SERVER_PREFIX = 'builtin_image_preset_';\n\nconst resolveImagePresetId = (\n    serverId: string,\n    explicit?: unknown,\n): string | undefined => {\n    const direct = typeof explicit === 'string' ? explicit.trim() : '';\n    if (direct) return direct;\n    const normalizedServerId = String(serverId || '');\n    if (!normalizedServerId.startsWith(IMAGE_PRESET_SERVER_PREFIX)) return undefined;\n    return normalizedServerId.slice(IMAGE_PRESET_SERVER_PREFIX.length).trim() || undefined;\n};\n\nconst engineIdFromServer = (""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """    ) return null;\n\n    return {\n        id: raw.id,""",
              """    ) return null;\n\n    const imagePresetId = resolveImagePresetId(raw.serverId, raw.imagePresetId);\n    const storedBillingCapture = raw.imageBillingCapture && typeof raw.imageBillingCapture === 'object'\n        ? clone(raw.imageBillingCapture) as ImageGenerationBillingCapture\n        : undefined;\n    const imageBillingCapture = imagePresetId && storedBillingCapture?.presetId !== imagePresetId\n        ? captureImageGenerationBilling(raw.engineId, imagePresetId)\n        : storedBillingCapture;\n\n    return {\n        id: raw.id,""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        engineId: raw.engineId,\n        serverId: raw.serverId,\n        serverName: raw.serverName,\n        controlBaseUrl:""",
              """        engineId: raw.engineId,\n        serverId: raw.serverId,\n        serverName: raw.serverName,\n        imagePresetId,\n        controlBaseUrl:""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        imageBillingCapture: raw.imageBillingCapture && typeof raw.imageBillingCapture === 'object'\n            ? clone(raw.imageBillingCapture)\n            : undefined,\n    };""",
              """        imageBillingCapture,\n    };""",
          )

          # Preserve preset identity when persisting story-theater images.
          replace_once(
              'utils/backgroundImageJobs.ts',
              """            server: {\n                id: localJob.serverId,\n                name: localJob.serverName,\n            },""",
              """            server: {\n                id: localJob.serverId,\n                name: localJob.serverName,\n                imagePresetId: localJob.imagePresetId,\n            },""",
          )
          # Preserve it for ordinary background images too (different indentation in this block).
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        server: {\n            id: localJob.serverId,\n            name: localJob.serverName,\n        },""",
              """        server: {\n            id: localJob.serverId,\n            name: localJob.serverName,\n            imagePresetId: localJob.imagePresetId,\n        },""",
          )

          replace_once(
              'utils/backgroundImageJobs.ts',
              """    const state = readState();\n    const existing = state.jobs.find(job => job.clientRequestId === clientRequestId);\n    if (existing) {""",
              """    const imagePresetId = resolveImagePresetId(server.id, server.imagePresetId);\n    const state = readState();\n    const existing = state.jobs.find(job => job.clientRequestId === clientRequestId);\n    if (existing) {""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """            storyTheaterTarget: context.ownerType === 'story-theater'\n                ? context.storyTheaterTarget\n                : existing.storyTheaterTarget,\n            workerOwnsSubmission: true,\n            lastError: undefined,""",
              """            storyTheaterTarget: context.ownerType === 'story-theater'\n                ? context.storyTheaterTarget\n                : existing.storyTheaterTarget,\n            imagePresetId: imagePresetId || existing.imagePresetId,\n            imageBillingCapture: imagePresetId\n                ? captureImageGenerationBilling(engineId, imagePresetId)\n                : existing.imageBillingCapture,\n            workerOwnsSubmission: true,\n            lastError: undefined,""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        engineId,\n        serverId: server.id,\n        serverName: server.name,\n        controlBaseUrl: normalizeBaseUrl(server.controlBaseUrl),""",
              """        engineId,\n        serverId: server.id,\n        serverName: server.name,\n        imagePresetId,\n        controlBaseUrl: normalizeBaseUrl(server.controlBaseUrl),""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        workerOwnsSubmission: true,\n        imageBillingCapture: captureImageGenerationBilling(engineId),\n    };""",
              """        workerOwnsSubmission: true,\n        imageBillingCapture: captureImageGenerationBilling(engineId, imagePresetId),\n    };""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """    const createdAt = now();\n\n    const localJob:\n        LocalBackgroundImageJob = {\n        id: makeLocalId(),""",
              """    const imagePresetId = resolveImagePresetId(server.id, server.imagePresetId);\n    const createdAt = now();\n\n    const localJob:\n        LocalBackgroundImageJob = {\n        id: makeLocalId(),""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        engineId,\n        serverId: server.id,\n        serverName: server.name,\n        controlBaseUrl:\n            normalizeBaseUrl(""",
              """        engineId,\n        serverId: server.id,\n        serverName: server.name,\n        imagePresetId,\n        controlBaseUrl:\n            normalizeBaseUrl(""",
          )
          replace_once(
              'utils/backgroundImageJobs.ts',
              """        updatedAt: createdAt,\n        submitAttempts: 1,\n        imageBillingCapture: captureImageGenerationBilling(engineId),\n    };""",
              """        updatedAt: createdAt,\n        submitAttempts: 1,\n        imageBillingCapture: captureImageGenerationBilling(engineId, imagePresetId),\n    };""",
          )

          # 3) Persistence can recover preset identity from the encoded server id as a defensive fallback,
          # and refuses a mismatched billing snapshot.
          replace_once(
              'utils/mcpImagePersistence.ts',
              """const resolvePresetReplayMetadata = (\n    server: PersistMcpImageInput['server'],\n    toolName: string,\n): Record<string, unknown> => {\n    let presetId = server?.imagePresetId;""",
              """const IMAGE_PRESET_SERVER_PREFIX = 'builtin_image_preset_';\n\nconst resolveImagePresetIdFromServer = (\n    server: PersistMcpImageInput['server'],\n): string | undefined => {\n    const explicit = String(server?.imagePresetId || '').trim();\n    if (explicit) return explicit;\n    const serverId = String(server?.id || '');\n    if (!serverId.startsWith(IMAGE_PRESET_SERVER_PREFIX)) return undefined;\n    return serverId.slice(IMAGE_PRESET_SERVER_PREFIX.length).trim() || undefined;\n};\n\nconst resolvePresetReplayMetadata = (\n    server: PersistMcpImageInput['server'],\n    toolName: string,\n): Record<string, unknown> => {\n    let presetId = resolveImagePresetIdFromServer(server);""",
          )
          replace_once(
              'utils/mcpImagePersistence.ts',
              """            const requestId = String(structured.requestId || structured.correlationId || `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`);\n            const model = String(structured.model || input.toolArgs?.model || engineId);\n            try {\n                await recordSuccessfulImageGeneration({\n                    capture: input.imageBillingCapture || captureImageGenerationBilling(engineId),""",
              """            const requestId = String(structured.requestId || structured.correlationId || `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`);\n            const model = String(structured.model || input.toolArgs?.model || engineId);\n            const presetId = resolveImagePresetIdFromServer(input.server);\n            const billingCapture = presetId\n                ? (input.imageBillingCapture?.presetId === presetId\n                    ? input.imageBillingCapture\n                    : captureImageGenerationBilling(engineId, presetId))\n                : (input.imageBillingCapture || captureImageGenerationBilling(engineId));\n            try {\n                await recordSuccessfulImageGeneration({\n                    capture: billingCapture,""",
          )

          # 4) Extend the existing story wiring regression test so future refactors cannot go back to active-preset guessing.
          replace_once(
              'utils/storyTheaterBillingSafety.wiring.test.ts',
              """const storyImageSource = read('./storyTheaterImage.ts');\nconst configCheckFetchGuardSource = read('./configCheckFetchGuard.ts');""",
              """const storyImageSource = read('./storyTheaterImage.ts');\nconst backgroundImageJobsSource = read('./backgroundImageJobs.ts');\nconst imageGenerationBillingSource = read('./imageGenerationBilling.ts');\nconst mcpImagePersistenceSource = read('./mcpImagePersistence.ts');\nconst configCheckFetchGuardSource = read('./configCheckFetchGuard.ts');""",
          )
          replace_once(
              'utils/storyTheaterBillingSafety.wiring.test.ts',
              """    it('labels story requests and preserves sampling and transport diagnostics', () => {""",
              """    it('pins story image billing and replay metadata to the actually selected image preset', () => {\n        expect(imageGenerationBillingSource).toContain('presetId?: string,');\n        expect(imageGenerationBillingSource).toContain('getImageGenerationPresets(engineId).find(item => item.id === requestedPresetId)');\n        expect(backgroundImageJobsSource).toContain(\"const IMAGE_PRESET_SERVER_PREFIX = 'builtin_image_preset_';\");\n        expect(backgroundImageJobsSource).toContain('imagePresetId?: string;');\n        expect(backgroundImageJobsSource).toContain('imagePresetId: imagePresetId || existing.imagePresetId');\n        expect(backgroundImageJobsSource.match(/imagePresetId: localJob\\.imagePresetId/g) || []).toHaveLength(2);\n        expect(backgroundImageJobsSource.match(/captureImageGenerationBilling\\(engineId, imagePresetId\\)/g) || []).toHaveLength(3);\n        expect(mcpImagePersistenceSource).toContain('resolveImagePresetIdFromServer');\n        expect(mcpImagePersistenceSource).toContain('input.imageBillingCapture?.presetId === presetId');\n        expect(mcpImagePersistenceSource).toContain('captureImageGenerationBilling(engineId, presetId)');\n    });\n\n    it('labels story requests and preserves sampling and transport diagnostics', () => {""",
          )
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run focused story image regressions
        run: >-
          pnpm exec vitest run
          utils/storyTheaterBillingSafety.wiring.test.ts
          utils/storyTheaterImage.inlinePlan.test.ts
          worker/amsg/src/storyImageHandoff.test.ts

      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-story-image-preset-billing.yml
          git config user.name "SullyOS Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add utils/imageGenerationBilling.ts utils/backgroundImageJobs.ts utils/mcpImagePersistence.ts utils/storyTheaterBillingSafety.wiring.test.ts
          git commit -m "fix: preserve selected image preset billing identity"
          git push origin HEAD:master
