name: Fix Story dialogue indent once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-story-dialogue-indent-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Story dialogue button indent only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/date/story/StoryTheaterSession.tsx')
          text = path.read_text()
          old = """                                        letterSpacing: 'inherit',\n                                        whiteSpace: 'inherit',\n"""
          new = """                                        letterSpacing: 'inherit',\n                                        whiteSpace: 'inherit',\n                                        // The paragraph owns the 2em first-line indent. The native\n                                        // dialogue button must not inherit it or every wrapped line\n                                        // becomes indented and the spoken text collapses into a narrow column.\n                                        textIndent: 0,\n"""
          if old not in text:
              raise SystemExit('target Story dialogue style block not found')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify scope
        run: |
          git diff --check
          git diff -- components/date/story/StoryTheaterSession.tsx
          test "$(git diff --name-only | grep -v '^\.github/workflows/fix-story-dialogue-indent-once.yml$' | tr -d '\r')" = "components/date/story/StoryTheaterSession.tsx"
          grep -q "textIndent: 0" components/date/story/StoryTheaterSession.tsx

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Commit source fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-story-dialogue-indent-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx .github/workflows/fix-story-dialogue-indent-once.yml
          git commit -m "fix(story): keep voiced dialogue wrapping aligned"
          git push origin HEAD:master
