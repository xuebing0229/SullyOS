name: Apply shared long-press patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-shared-longpress-once.yml'
      - '.github/scripts/patch-shared-longpress.py'

permissions:
  contents: write

jobs:
  patch-shared-longpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply shared gesture patch
        run: python .github/scripts/patch-shared-longpress.py

      - name: Verify patch shape
        run: |
          grep -q "useLongPressGesture<HTMLDivElement, Message>" components/chat/MessageItem.tsx
          grep -q "useLongPressGesture<HTMLSpanElement, StoryDialoguePressTarget>" components/date/story/StoryTheaterSession.tsx
          grep -q "useLongPressGesture<HTMLElement, Message>" components/date/story/StoryTheaterSession.tsx
          ! grep -q "dialoguePressTimerRef" components/date/story/StoryTheaterSession.tsx
          ! grep -q "const longPressTimer = useRef" components/date/story/StoryTheaterSession.tsx
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Commit verified patch
        run: |
          rm .github/workflows/patch-shared-longpress-once.yml
          rm .github/scripts/patch-shared-longpress.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hooks/useLongPressGesture.ts components/chat/MessageItem.tsx components/date/story/StoryTheaterSession.tsx .github/workflows/patch-shared-longpress-once.yml .github/scripts/patch-shared-longpress.py
          git diff --cached --check
          git commit -m "refactor(gestures): share chat long press with story"
          git push origin HEAD:master
