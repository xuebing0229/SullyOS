name: Fix Story dialogue inline layout once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-story-dialogue-inline-anchor-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Story dialogue inline control only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/date/story/StoryTheaterSession.tsx')
          text = path.read_text()

          old_generic = "useLongPressGesture<HTMLButtonElement, StoryDialoguePressTarget>"
          new_generic = "useLongPressGesture<HTMLAnchorElement, StoryDialoguePressTarget>"
          if text.count(old_generic) != 1:
              raise SystemExit(f'expected one dialogue gesture generic, found {text.count(old_generic)}')
          text = text.replace(old_generic, new_generic, 1)

          old_open = """                                return <button\n                                    key={segmentIndex}\n                                    type='button'\n                                    data-story-speaker={segment.speaker}\n"""
          new_open = """                                return <a\n                                    key={segmentIndex}\n                                    href='#'\n                                    role='button'\n                                    data-story-speaker={segment.speaker}\n"""
          if text.count(old_open) != 1:
              raise SystemExit(f'expected one Story dialogue button opening, found {text.count(old_open)}')
          text = text.replace(old_open, new_open, 1)

          old_click = """                                    onClick={event => {\n                                        event.stopPropagation();\n                                        if (dialoguePress.consumeSuppressedClick()) {\n                                            event.preventDefault();\n                                            return;\n                                        }\n"""
          new_click = """                                    onClick={event => {\n                                        // Keep native inline-link tap semantics for Android WebView,\n                                        // but this is an action, never a navigation.\n                                        event.preventDefault();\n                                        event.stopPropagation();\n                                        if (dialoguePress.consumeSuppressedClick()) {\n                                            return;\n                                        }\n"""
          if text.count(old_click) != 1:
              raise SystemExit(f'expected one Story dialogue click handler, found {text.count(old_click)}')
          text = text.replace(old_click, new_click, 1)

          old_style = """                                    className='inline cursor-pointer border-0 bg-transparent p-0 m-0 text-left align-baseline'\n                                    style={{\n                                        ...(toneStyle || {}),\n                                        font: 'inherit',\n                                        lineHeight: 'inherit',\n                                        letterSpacing: 'inherit',\n                                        whiteSpace: 'inherit',\n                                        // The paragraph owns the 2em first-line indent. The native\n                                        // dialogue button must not inherit it or every wrapped line\n                                        // becomes indented and the spoken text collapses into a narrow column.\n                                        textIndent: 0,\n                                    }}\n                                >\n                                    {renderedText}\n                                </button>;\n"""
          new_style = """                                    className='inline cursor-pointer bg-transparent p-0 m-0 text-left align-baseline no-underline'\n                                    style={{\n                                        ...(toneStyle || {}),\n                                        font: 'inherit',\n                                        lineHeight: 'inherit',\n                                        letterSpacing: 'inherit',\n                                        whiteSpace: 'inherit',\n                                        textDecoration: 'none',\n                                    }}\n                                >\n                                    {renderedText}\n                                </a>;\n"""
          if text.count(old_style) != 1:
              raise SystemExit(f'expected one Story dialogue style/closing block, found {text.count(old_style)}')
          text = text.replace(old_style, new_style, 1)

          path.write_text(text)
          PY

      - name: Verify scope and shape
        run: |
          git diff --check
          test "$(git diff --name-only | grep -v '^\.github/workflows/fix-story-dialogue-inline-anchor-once.yml$' | tr -d '\r')" = "components/date/story/StoryTheaterSession.tsx"
          grep -q "useLongPressGesture<HTMLAnchorElement, StoryDialoguePressTarget>" components/date/story/StoryTheaterSession.tsx
          grep -q "href='#'" components/date/story/StoryTheaterSession.tsx
          grep -q "role='button'" components/date/story/StoryTheaterSession.tsx
          ! grep -q "dialogue button must not inherit" components/date/story/StoryTheaterSession.tsx

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Commit source fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-story-dialogue-inline-anchor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx .github/workflows/fix-story-dialogue-inline-anchor-once.yml
          git commit -m "fix(story): keep voiced dialogue truly inline"
          git push origin HEAD:master
