name: Temporary story missing-image patch

on:
  push:
    branches:
      - feature/eat-image-reroll-20260912

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eat-image-reroll-20260912
      - name: Apply exact StoryRoundImage patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/date/story/StoryTheaterSession.tsx')
          text = path.read_text(encoding='utf-8')
          old = "    if (!frame?.imageRef) return null;"
          new = """    if (!frame?.imageRef) return <div className='mt-5 flex justify-end'>\n        <button type='button' disabled={busy} onClick={onRegenerate} className='inline-flex items-center gap-1.5 rounded-full border border-dashed border-violet-200 bg-violet-50/60 px-3 py-1.5 text-[9px] font-bold text-violet-600 disabled:opacity-40'>\n            {busy ? <SpinnerGap size={12} className='animate-spin' /> : <ArrowClockwise size={12} />}\n            {busy ? '正在补图…' : '补一张配图'}\n        </button>\n    </div>;"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one StoryRoundImage empty-state anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- components/date/story/StoryTheaterSession.tsx
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx
          git commit -m "feat(story): allow filling missing round images"
          git push origin HEAD:feature/eat-image-reroll-20260912
