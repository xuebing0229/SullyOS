name: Apply story image viewer patch

on:
  push:
    branches:
      - feat/story-image-viewer

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-image-viewer
      - name: Apply story image viewer patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/date/story/StoryTheaterSession.tsx')
          text = path.read_text(encoding='utf-8')

          old_import = "import { BACKGROUND_IMAGE_JOB_EVENT } from '../../../utils/backgroundImageJobs';"
          new_import = old_import + "\nimport { openChatImageViewer } from '../../../utils/chatImageViewer';"
          if text.count(old_import) != 1:
              raise SystemExit(f'unexpected import match count: {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old_image = "        <TokenImg value={frame.imageRef} alt='本轮剧情配图' className='block h-auto w-full object-cover' />"
          new_image = """        <button
            type='button'
            onClick={() => openChatImageViewer({ src: frame.imageRef, alt: '本轮剧情配图' })}
            className='block w-full cursor-zoom-in bg-transparent p-0 text-left'
            aria-label='查看本轮剧情配图大图'
            title='点击查看大图'
        >
            <TokenImg value={frame.imageRef} alt='本轮剧情配图' className='block h-auto w-full object-cover' />
        </button>"""
          if text.count(old_image) != 1:
              raise SystemExit(f'unexpected image match count: {text.count(old_image)}')
          text = text.replace(old_image, new_image, 1)

          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx
          git commit -m "feat: open story images in full-screen viewer"
          git push origin HEAD:feat/story-image-viewer
