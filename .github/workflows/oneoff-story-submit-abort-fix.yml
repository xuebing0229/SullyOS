name: Temp Story Submit Abort Patch

on:
  push:
    branches:
      - tmp-story-submit-abort-fix
    paths:
      - .github/workflows/oneoff-story-submit-abort-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp-story-submit-abort-fix

      - name: Patch diagnostic gate
        run: python scripts/oneoff_patch_story_submit_abort.py

      - name: Verify suppression matrix
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlsplit
          get_pattern = re.compile(r'^/story-jobs/(?:by-client/)?[^/]+/?$')
          def suppressed(method, name, url, body=None):
              if name != 'AbortError': return False
              path = urlsplit(url).path
              if method == 'GET': return bool(get_pattern.match(path))
              if method != 'POST' or path != '/story-jobs' or not isinstance(body, str): return False
              try: spec = json.loads(body)
              except Exception: return False
              return isinstance(spec.get('jobId'), str) and spec['jobId'].startswith('storycloud_') and isinstance(spec.get('clientRequestId'), str) and spec['clientRequestId'].startswith('storyreq_') and isinstance(spec.get('routes'), list) and len(spec['routes']) > 0 and isinstance(spec.get('baseBody'), dict)
          valid = json.dumps({'jobId':'storycloud_123','clientRequestId':'storyreq_123','routes':[{'model':'x'}],'baseBody':{'messages':[]}})
          assert suppressed('GET','AbortError','https://example.test/story-jobs/storycloud_123')
          assert suppressed('GET','AbortError','https://example.test/story-jobs/by-client/storyreq_123')
          assert suppressed('POST','AbortError','https://example.test/story-jobs',valid)
          assert not suppressed('POST','AbortError','https://example.test/story-jobs','{}')
          assert not suppressed('POST','TypeError','https://example.test/story-jobs',valid)
          assert not suppressed('POST','AbortError','https://example.test/outbox',valid)
          assert not suppressed('GET','AbortError','https://example.test/outbox')
          PY

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run story transport regressions
        run: pnpm exec vitest run utils/safeApi.stream.test.ts utils/apiFailover.test.ts utils/storyTheaterBillingSafety.wiring.test.ts utils/backgroundStoryJobs.polling.test.ts

      - name: Build production app
        run: pnpm run build

      - name: Commit patched source
        run: |
          git config user.name 'github-actions-bot'
          git config user.email 'github-actions-bot@users.noreply.github.com'
          git add context/OSContext.tsx
          git commit -m 'Ignore recoverable story job submit abort diagnostics'
          git push origin HEAD:tmp-story-submit-abort-fix
