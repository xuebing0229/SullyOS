name: Temporary native story cloud notification patch

on:
  push:
    paths:
      - '.github/workflows/tmp-native-story-cloud-notifications.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python .github/scripts/patch_native_story_cloud_notifications.py
      - name: Verify diff
        run: |
          git diff --check
          git diff -- native/android/SullyStoryBackgroundPlugin.java native/android/SullyStoryCloudMonitorService.java scripts/install-android-story-background.mjs utils/nativeStoryBackground.ts utils/backgroundStoryJobs.ts scripts/storyBackgroundStatusNotification.wiring.test.ts .github/workflows/build-apk.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/android/SullyStoryBackgroundPlugin.java scripts/install-android-story-background.mjs utils/nativeStoryBackground.ts utils/backgroundStoryJobs.ts scripts/storyBackgroundStatusNotification.wiring.test.ts .github/workflows/build-apk.yml
          git commit -m 'fix: make story status notifications native and independent'
