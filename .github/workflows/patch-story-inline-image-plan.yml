name: Apply story inline image plan patch

on:
  push:
    branches:
      - feat/story-inline-image-plan
    paths:
      - '.github/workflows/patch-story-inline-image-plan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/story-inline-image-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: node scripts/patch-story-inline-image-plan.mjs
      - name: Commit patched source and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(story): use inline image plan from main completion"
          git push origin HEAD:feat/story-inline-image-plan
