name: Pull Request CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run story transport regression tests
        run: pnpm exec vitest run utils/safeApi.stream.test.ts utils/apiFailover.test.ts utils/storyTheaterBillingSafety.wiring.test.ts utils/storyTheaterImage.inlinePlan.test.ts

      - name: Build production app
        run: pnpm run build

      - name: Create and sync Android project
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
