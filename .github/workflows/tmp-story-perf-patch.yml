name: Temporary story background latency patch

on:
  push:
    paths:
      - '.github/workflows/tmp-story-perf-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_story_perf.py
      - name: Verify diff
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/amsg/src/storyJobs.ts components/date/story/StoryTheaterSession.tsx utils/storyTheaterImage.ts
          git commit -m "perf: remove story background recovery stalls"
          git push origin master
