name: Run story owner hotfix

on:
  push:
    branches:
      - fix/story-request-owner-20260906

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-request-owner-20260906
          fetch-depth: 0

      - name: Reuse exact-match patch script
        shell: bash
        run: |
          awk '
            /^          python3 - <<'\''PY'\''$/ { capture=1; next }
            /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/story-owner-hotfix.yml > /tmp/story-owner-patch.py
          test -s /tmp/story-owner-patch.py
          python3 /tmp/story-owner-patch.py

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm exec tsc --noEmit

      - name: Build production app
        run: pnpm run build

      - name: Verify diff and commit source-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/story-owner-hotfix.yml .github/workflows/story-owner-hotfix-run.yml
          git add components/date/story/StoryTheaterSession.tsx utils/backgroundStoryJobs.ts utils/nativeStoryBackground.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: isolate story background jobs per request"
          git push origin HEAD:fix/story-request-owner-20260906
