name: One-time cleanup old SullyOS APK artifacts

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cleanup-old-apk-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete stored SullyOS APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.name | startswith("SullyOS-v")) | .id')"
          COUNT=0
          for ID in $IDS; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ID"
            COUNT=$((COUNT + 1))
          done
          echo "Deleted $COUNT SullyOS APK artifacts."
