name: Restore main chat gesture unchanged

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/restore-main-chat-gesture-once.yml'

permissions:
  contents: write

jobs:
  restore-main-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Restore MessageItem exactly from before gesture refactor
        run: |
          git checkout cb593ee5072250305ecf15d9aea2888cea27dda6 -- components/chat/MessageItem.tsx
          git diff --check

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm run build

      - name: Commit exact main-chat restore
        run: |
          rm .github/workflows/restore-main-chat-gesture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/MessageItem.tsx .github/workflows/restore-main-chat-gesture-once.yml
          git diff --cached --check
          git commit -m "fix(chat): keep proven gesture implementation untouched"
          git push origin HEAD:master
