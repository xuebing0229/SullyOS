name: Deploy existing AMSG Worker code

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-amsg-existing.yml'
      - 'scripts/deploy-existing-amsg.mjs'

permissions:
  contents: read

concurrency:
  group: amsg-existing-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 7387e6c44835b53fc5a77d9fc3d4d201
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMSG_SCRIPT_NAME: sullyos-amsg
      AMSG_WORKER_URL: https://sullyos-amsg.xuebing0229-sullyos.workers.dev

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AMSG bundle
        run: pnpm run build:workers

      - name: Replace only existing AMSG Worker code
        run: node scripts/deploy-existing-amsg.mjs
