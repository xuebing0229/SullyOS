name: Deploy existing AMSG Worker code

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'worker/amsg/**'
      - 'utils/**'
      - 'types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-amsg-existing.yml'
      - 'scripts/deploy-existing-amsg.mjs'

# Actions 使用 GITHUB_TOKEN 推回 master 时不会递归触发新的 workflow；
# 因此性能补丁若由仓库内 workflow 落盘，需要一次正常提交/手动 dispatch 才会部署最新 master。
permissions:
  contents: read

concurrency:
  group: amsg-existing-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 7387e6c44835b53fc5a77d9fc3d4d201
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AMSG_SCRIPT_NAME: sullyos-amsg
      AMSG_WORKER_URL: https://sullyos-amsg.xuebing0229-sullyos.workers.dev

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AMSG bundle
        run: pnpm run build:workers

      - name: Replace only existing AMSG Worker code
        run: node scripts/deploy-existing-amsg.mjs
