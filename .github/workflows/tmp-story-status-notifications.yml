name: Temporary story status notification patch

on:
  push:
    paths:
      - '.github/workflows/tmp-story-status-notifications.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Apply patch
        run: python .github/scripts/patch_story_status_notifications.py
      - name: Verify diff
        run: |
          git diff --check
          git diff --exit-code -- .github/scripts/patch_story_status_notifications.py .github/workflows/tmp-story-status-notifications.yml || true
          git diff -- worker/amsg/src/storyJobs.ts utils/amsgResults.ts native/android/SullyAmsgPollService.java
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/amsg/src/storyJobs.ts utils/amsgResults.ts native/android/SullyAmsgPollService.java
          git commit -m 'feat: notify story background generation status'
          git push origin master
