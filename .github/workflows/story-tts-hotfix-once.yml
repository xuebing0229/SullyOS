name: Story TTS speaker hotfix once

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/story-tts-hotfix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Apply Story TTS hotfix
        run: python scripts/story-tts-hotfix-once.py

      - name: Check patch
        run: |
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Story TTS tests
        run: pnpm test:run utils/storyTheaterVoice.test.ts

      - name: Build web app
        run: pnpm exec vite build

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore Story Theater dialogue TTS speaker flow"
          git push origin HEAD:master
