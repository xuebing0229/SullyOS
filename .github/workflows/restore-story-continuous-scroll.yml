name: Restore Story Continuous Scroll

on:
  push:
    paths:
      - '.github/workflows/restore-story-continuous-scroll.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore continuous story scrolling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          story_path = Path('components/date/story/StoryTheaterSession.tsx')
          source = story_path.read_text(encoding='utf-8')
          before = source

          source = source.replace(', CaretLeft, CaretRight, ChatCircleDots', ', ChatCircleDots')

          source, count = re.subn(
              r"\nconst STORY_PAGE_SIZE = 10;\n\nconst StoryPagination:[\s\S]*?\n\);\n\nconst normalizeAffinityInput",
              "\nconst normalizeAffinityInput",
              source,
              count=1,
          )
          assert count == 1, 'pagination component block not found'

          source = source.replace("    const [messagePage, setMessagePage] = useState(0);\n", '')

          source, count = re.subn(
              r"    const pageCount = Math\.max\(1, Math\.ceil\(messages\.length / STORY_PAGE_SIZE\)\);\n"
              r"    useEffect\(\(\) => \{ setMessagePage\(Math\.max\(0, pageCount - 1\)\); \}, \[messages\.length, pageCount\]\);\n"
              r"    const pageMessages =[\s\S]*?"
              r"    \}, \[pageArchivedIds\]\);\n",
              '',
              source,
              count=1,
          )
          assert count == 1, 'page slicing block not found'

          source, top_count = re.subn(
              r"\n\s*\{pageCount > 1 && <StoryPagination className='mb-4'[^\n]*\}\n",
              '\n',
              source,
              count=1,
          )
          assert top_count == 1, 'top pagination control not found'

          page_archive = "{pageArchivedIds.length > 0 && <div className='mb-7 px-1 flex items-center justify-between gap-3 text-[9px] text-slate-400'><span>本页 {pageArchivedIds.length} 条归档原文 · 展开时才渲染正文</span><button onClick={togglePageArchives} className='shrink-0 px-3 py-1.5 rounded-full bg-white border border-slate-200 font-bold text-violet-600'>{allPageArchivesExpanded ? '全部收起' : '全部展开'}</button></div>}"
          continuous_archive = "{archivedMessageIds.length > 0 && <div className='mb-7 px-1 flex items-center justify-between gap-3 text-[9px] text-slate-400'><span>{archivedMessageIds.length} 条归档原文 · 默认折叠，整段上下滑动浏览</span><button onClick={toggleAllArchives} className='shrink-0 px-3 py-1.5 rounded-full bg-white border border-slate-200 font-bold text-violet-600'>{allArchivesExpanded ? '全部收起' : '全部展开'}</button></div>}"
          assert page_archive in source, 'paged archive controls not found'
          source = source.replace(page_archive, continuous_archive, 1)

          assert '{pageMessages.map(message => {' in source, 'paged message map not found'
          source = source.replace('{pageMessages.map(message => {', '{messages.map(message => {', 1)

          source, bottom_count = re.subn(
              r"\n\s*\{pageCount > 1 && <StoryPagination className='mt-8'[^\n]*\}\n",
              '\n',
              source,
              count=1,
          )
          assert bottom_count == 1, 'bottom pagination control not found'

          assert 'STORY_PAGE_SIZE' not in source
          assert 'StoryPagination' not in source
          assert 'pageMessages' not in source
          assert 'messagePage' not in source
          assert '{messages.map(message => {' in source
          assert 'scrollContainerRef' in source
          assert 'initialBottomFollowRef' in source
          assert 'ResizeObserver' in source
          assert 'autoFollowStreamRef.current = distanceFromBottom <= 96' in source
          assert source != before
          story_path.write_text(source, encoding='utf-8')

          test_path = Path('utils/reportedIssuesRegression.wiring.test.ts')
          test = test_path.read_text(encoding='utf-8')
          title = '文游保持连续下滑并默认锚在底部，不回退到每页十条分页'
          if title not in test:
              block = '\n'.join([
                  '',
                  '',
                  "    it('文游保持连续下滑并默认锚在底部，不回退到每页十条分页', () => {",
                  "        const source = read('../components/date/story/StoryTheaterSession.tsx');",
                  '',
                  "        expect(source).not.toContain('STORY_PAGE_SIZE');",
                  "        expect(source).not.toContain('StoryPagination');",
                  "        expect(source).not.toContain('pageMessages');",
                  "        expect(source).not.toContain('messagePage');",
                  "        expect(source).toContain('{messages.map(message => {');",
                  "        expect(source).toContain('scrollContainerRef');",
                  "        expect(source).toContain('initialBottomFollowRef');",
                  "        expect(source).toContain('ResizeObserver');",
                  "        expect(source).toContain('autoFollowStreamRef.current = distanceFromBottom <= 96');",
                  "        expect(source).toContain('整段上下滑动浏览');",
                  '    });',
              ])
              pos = test.rfind('\n});')
              assert pos >= 0, 'regression suite terminator not found'
              test = test[:pos] + block + test[pos:]
              test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify patch invariants
        shell: bash
        run: |
          grep -q "{messages.map(message => {" components/date/story/StoryTheaterSession.tsx
          grep -q "initialBottomFollowRef" components/date/story/StoryTheaterSession.tsx
          grep -q "ResizeObserver" components/date/story/StoryTheaterSession.tsx
          ! grep -Eq "STORY_PAGE_SIZE|StoryPagination|pageMessages|messagePage" components/date/story/StoryTheaterSession.tsx

      - name: Commit restored behavior
        shell: bash
        run: |
          rm .github/workflows/restore-story-continuous-scroll.yml
          git config user.name "SullyOS Fix Bot"
          git config user.email "sullyos-fix-bot@users.noreply.github.com"
          git add components/date/story/StoryTheaterSession.tsx utils/reportedIssuesRegression.wiring.test.ts .github/workflows/restore-story-continuous-scroll.yml
          git commit -m "fix(story): restore continuous scrolling and bottom follow"
          git push origin HEAD:master
